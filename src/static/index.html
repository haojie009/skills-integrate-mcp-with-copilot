<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台股當沖選股雷達</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>台股當沖選股雷達</h1>
      <p class="subtitle">盤前選股　|　掃描近 300 檔個股，挑出明日當沖標的與飆股</p>
    </header>

    <div id="disclaimer" class="disclaimer">載入中…</div>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="screener">當沖選股</button>
      <button class="tab-btn" data-tab="categories">個股分類</button>
      <button class="tab-btn" data-tab="premarket">盤前簡報</button>
    </nav>

    <main>
      <div id="tab-screener">
        <section class="controls">
          <div class="sort-toggle">
            <button class="sort-btn active" data-sort="score">當沖適合度</button>
            <button class="sort-btn" data-sort="hot_score">飆股雷達</button>
            <button class="sort-btn" data-sort="amplitude_pct">振幅</button>
            <button class="sort-btn" data-sort="change_pct">漲幅</button>
            <button class="sort-btn" data-sort="turnover_yi">成交金額</button>
          </div>
          <div class="meta">
            <span id="data-source"></span>
            <button id="refresh-btn" title="重新掃描">↻ 更新</button>
          </div>
        </section>

        <section id="screener">
          <h3 id="list-title">當沖適合度排行</h3>
          <div id="screener-warn" class="warn-box hidden"></div>
          <div id="list" class="screener-list">
            <p class="loading">掃描全市場中…</p>
          </div>
        </section>
      </div>

      <div id="tab-categories" class="hidden">
        <section id="categories">
          <h3>成交量排行（當日成交張數）</h3>
          <div id="volume-list" class="screener-list">
            <p class="loading">載入中…</p>
          </div>
          <h3 style="margin-top:24px">熱門題材（依成分股平均漲跌幅）</h3>
          <div id="theme-list">
            <p class="loading">載入中…</p>
          </div>
        </section>
      </div>

      <div id="tab-premarket" class="hidden">
        <section id="premarket">
          <h3>每日盤前簡報</h3>
          <p class="pm-intro">開盤前的情報整理、持股風險檢查與交易計畫。
            AI 扮演盤前助理與風控,不提供買賣明牌。</p>
          <div class="pm-form">
            <label>我的持股（代號，逗號分隔）
              <input id="pm-holdings" type="text" placeholder="例：2330,2317,2454" />
            </label>
            <label>觀察股（選填）
              <input id="pm-watch" type="text" placeholder="例：3008,2603" />
            </label>
            <button id="pm-run-btn" class="retry-btn">產生今日盤前簡報</button>
          </div>
          <div id="pm-result"></div>
        </section>
      </div>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <button id="modal-close" class="modal-close">✕</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <footer>
      <p>本工具僅供教學與研究，所有評分與買賣計畫均為量化規則自動產生，<strong>非投資建議</strong>。</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="app.js"></script>
  </body>
</html>
