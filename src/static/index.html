<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台股當沖／隔日沖選股助手</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>台股當沖／隔日沖選股助手</h1>
      <p class="subtitle">技術面 ＋ 基本面 ＋ 消息面 綜合評分　|　告訴你「買哪支、何時進、何時出」</p>
    </header>

    <div id="disclaimer" class="disclaimer">載入中…</div>

    <main>
      <section class="controls">
        <div class="strategy-toggle">
          <button class="strategy-btn active" data-strategy="day">當沖（當日沖銷）</button>
          <button class="strategy-btn" data-strategy="overnight">隔日沖（留倉一晚）</button>
        </div>
        <div class="meta">
          <span id="data-source"></span>
          <span id="as-of"></span>
          <button id="refresh-btn" title="重新分析">↻ 更新</button>
        </div>
      </section>

      <section id="top-pick" class="top-pick hidden"></section>

      <section id="recommendations">
        <h3 id="list-title">建議排行</h3>
        <div id="list" class="card-list">
          <p class="loading">分析中…</p>
        </div>
      </section>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <button id="modal-close" class="modal-close">✕</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <footer>
      <p>本工具僅供教學與研究，所有評分與買賣計畫均為量化規則自動產生，<strong>非投資建議</strong>。</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
